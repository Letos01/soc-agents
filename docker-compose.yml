# Four A2A agent servers. The orchestrator is the CLI:
#   docker compose up -d --build
#   docker compose run --rm cli investigate --alert-id 1729000000.1234
# Needs ../mcp-wazuh built (npm ci && npm run build) and a .env (see .env.example).
#
# All agents share the triage container's network namespace, so A2A runs over 127.0.0.1: ADK refuses plain-http
# A2A to a non-loopback host, and no other container on the host can reach the agents at all. Each agent is still
# its own container and process with its own Agent Card and allowlist.
x-agent: &agent
  build: .
  env_file: .env
  environment:
    AGENT_HOST: 127.0.0.1
    AGENT_PUBLIC_HOST: 127.0.0.1
  volumes:
    - ../mcp-wazuh:/opt/mcp-wazuh:ro
    - ./data:/data
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

x-shared-net: &shared-net
  network_mode: "service:triage"
  depends_on: [triage]

services:
  triage:
    <<: *agent
    command: ["serve", "triage"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  enrichment:
    <<: [*agent, *shared-net]
    command: ["serve", "enrichment"]
  investigator:
    <<: [*agent, *shared-net]
    command: ["serve", "investigator"]
  reporter:
    <<: [*agent, *shared-net]
    command: ["serve", "reporter"]
  cli:
    <<: [*agent, *shared-net]
    profiles: [cli]
    restart: "no"
    depends_on: [triage, enrichment, investigator, reporter]
