[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "soc-agents"
version = "0.1.0"
description = "Security-first multi-agent SOC triage on Google ADK + A2A, consuming the read-only mcp-wazuh MCP server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leonardo Nery" }]
dependencies = [
  "google-adk>=2.12,<3",
  "a2a-sdk>=1.2",
  "mcp>=1.0",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
litellm = ["litellm>=1.50"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
soc-agents = "soc_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/soc_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["e2e: needs a live lab and a real model (SOC_E2E=1)"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["src/soc_agents"]
omit = ["src/soc_agents/cli.py", "src/soc_agents/server.py", "src/soc_agents/__main__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]
